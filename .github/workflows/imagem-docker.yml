# Publica a imagem do Vitrine no GitHub Container Registry (ghcr.io/<dono>/<repositório>).
#   - push na main:          etiqueta `latest` e `sha-<commit>`
#   - tag vX.Y.Z:             etiquetas `X.Y.Z` e `X.Y`
# Usa só o GITHUB_TOKEN do próprio workflow: nenhum segredo precisa ser cadastrado.
# Na primeira publicação o pacote nasce privado: torne-o público uma vez, em
# Package settings > Change visibility.
name: Imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
